# codeloom PR review map — publish step (trusted: never checks out or runs the PR's own code).
# Installed by "codeloom init --github"; see docs/pr-review-maps.md. It only ever checks out the
# "gh-pages" branch and installs codeloom from npm at the version pinned below — nothing from the PR's
# own checkout or workflow file reaches the published site or the PR description.
name: codeloom review publish

on:
  workflow_run:
    workflows: ["codeloom review build"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: codeloom-pages

jobs:
  publish:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          PR="$EVENT_PR_NUMBER"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            # A fork PR: the workflow_run event carries no pull_requests entry for it, so look the PR
            # up by its head commit instead.
            PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "no pull request found for commit $HEAD_SHA" >&2
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # No "ref:" — checkout then defaults to this (the publish) workflow's own trigger context,
      # which for workflow_run is the base repo's default branch, never the pull request's head. The
      # clone (with its origin remote and push credentials, courtesy of actions/checkout) lands in
      # ./gh-pages, so the rest of this job keeps its own working directory for the artifact and
      # site/; the gh-pages branch is then checked out (or created, orphaned, the first time) inside
      # that same already-authenticated clone, so the later push needs no extra credential setup.
      - name: Checkout the repo (for its gh-pages branch)
        uses: actions/checkout@v4
        with:
          path: gh-pages
          fetch-depth: 0

      - name: Switch to gh-pages, creating it the first time
        working-directory: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q origin gh-pages
            git checkout -q gh-pages
          else
            git checkout -q --orphan gh-pages
            git rm -rqf . >/dev/null 2>&1 || true
            git commit -q --allow-empty -m "codeloom: create gh-pages"
          fi

      - name: Download the build artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: codeloom-snapshot
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Current PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr view "$PR" --repo "$REPO" --json body -q .body > body.txt

      # Never fails the step itself: a refused artifact (exit 1) still has to update the PR from
      # whatever codeloom wrote to site/ (never gh-pages) and then fail the job visibly — see the
      # last step. "--previous" is always passed in the failed-build branch; a missing or invalid
      # gh-pages/pr-$PR/data/manifest.json (e.g. this PR's very first build failed) is tolerated.
      - name: Build the review site
        id: build_site
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          LINK="https://$OWNER.github.io/$NAME/pr-$PR/"
          set +e
          if [ "$CONCLUSION" != "success" ] || [ "$DOWNLOAD_OUTCOME" != "success" ] || [ -f artifact/failed ]; then
            npx -y codeloom@{{version}} snapshot-site --failed "$RUN_URL" --previous "gh-pages/pr-$PR/data/manifest.json" --link "$LINK" --body body.txt --out site
          else
            npx -y codeloom@{{version}} snapshot-site --data artifact/data --out site --head "$HEAD_SHA" --pr "$PR" --repo "$REPO" --link "$LINK" --body body.txt
          fi
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      # The visible block is comment.md when the artifact's block was too big for the PR body (body.md
      # is then the rest of the description, with the old inline block already removed by
      # snapshot-site); otherwise it's body.md itself. Appended after codeloom wrote its own files, so
      # this note survives into whichever one is actually shown.
      - name: Note that Pages is not enabled yet
        if: steps.pages.outputs.enabled == '0'
        run: |
          FILE="site/comment.md"
          [ -f "$FILE" ] || FILE="site/body.md"
          if [ -f "$FILE" ]; then
            {
              echo ""
              echo "GitHub Pages is not enabled for this repo yet — enable it under Settings → Pages,"
              echo "branch \`gh-pages\`, to see the hosted review map."
            } >> "$FILE"
          fi

      # Runs whether the build step above succeeded or was refused (exit_code 1): a refusal still
      # needs the PR updated with the "refused" block codeloom wrote to body.md/comment.md. body.md
      # and comment.md are not mutually exclusive: over GitHub's body limit, codeloom writes both
      # (body.md: the description with the block removed; comment.md: the block itself), so both are
      # applied when present.
      - name: Update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ -f site/body.md ]; then
            gh pr edit "$PR" --repo "$REPO" --body-file site/body.md
          fi
          if [ -f site/comment.md ]; then
            ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq 'map(select(.body != null and (.body | startswith("<!-- codeloom:review:start -->")))) | .[0].id // empty')
            if [ -n "$ID" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$ID" -f body=@site/comment.md
            else
              gh api --method POST "repos/$REPO/issues/$PR/comments" -f body=@site/comment.md
            fi
          fi

      # Only ever copies what codeloom itself wrote to site/ (this codeloom version's own dashboard
      # assets plus data/, never anything read directly from the untrusted artifact/), and only when
      # the build step actually produced a hosted site — a refused artifact never reaches gh-pages.
      - name: Publish the site to gh-pages
        if: steps.build_site.outputs.exit_code == '0'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          rm -rf "gh-pages/pr-$PR"
          mkdir -p "gh-pages/pr-$PR"
          for entry in site/*; do
            base="$(basename "$entry")"
            case "$base" in
              review.md|body.md|comment.md) continue ;;
            esac
            cp -r "$entry" "gh-pages/pr-$PR/"
          done

      - name: Commit and push gh-pages
        if: steps.build_site.outputs.exit_code == '0'
        working-directory: gh-pages
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "codeloom[bot]"
          git config user.email "codeloom[bot]@users.noreply.github.com"
          git add "pr-$PR"
          if git diff --cached --quiet; then
            echo "nothing changed for pr-$PR"
          else
            git commit -q -m "codeloom: PR #$PR review map"
            if ! git push origin gh-pages; then
              git pull --rebase origin gh-pages
              git push origin gh-pages
            fi
          fi

      # The PR already got its "refused" block above; this just makes the run itself show red, so a
      # refusal is not silently green.
      - name: Fail the run if codeloom refused the artifact
        if: steps.build_site.outputs.exit_code != '0'
        run: |
          echo "codeloom snapshot-site refused the build artifact (exit ${{ steps.build_site.outputs.exit_code }}); see the PR for why." >&2
          exit 1

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # A missing gh-pages branch (no PR on this repo ever published a snapshot) is fine — nothing to
      # clean up — so a failed checkout here does not fail the job.
      - name: Checkout gh-pages
        id: checkout_pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove the PR's review map
        if: steps.checkout_pages.outcome == 'success'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "codeloom[bot]"
          git config user.email "codeloom[bot]@users.noreply.github.com"
          git rm -rq --ignore-unmatch "pr-$PR"
          if git diff --cached --quiet; then
            echo "nothing to remove for pr-$PR"
          else
            git commit -q -m "codeloom: remove PR #$PR review map"
            git push origin gh-pages
          fi
