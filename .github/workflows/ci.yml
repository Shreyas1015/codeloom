name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (includes the eval gate)
        run: pnpm --filter codeloom test

      - name: CLI smoke test (built bin, demo-shop)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/packages/cli/dist/bin.js"
          ROOT=$(mktemp -d)
          cp -R "$GITHUB_WORKSPACE/fixtures/demo-shop/." "$ROOT"

          # Turn each repo folder into a git repo, the same way
          # packages/cli/test/helpers.ts's materializeFixture does for tests.
          for d in "$ROOT"/*/; do
            [ -d "$d" ] || continue
            git -C "$d" init -q -b main
            git -C "$d" -c user.name=ci -c user.email=ci@example.com add -A
            git -C "$d" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m update
          done

          node "$BIN" init "$ROOT"
          (cd "$ROOT" && node "$BIN" index)
          (cd "$ROOT" && node "$BIN" check)
