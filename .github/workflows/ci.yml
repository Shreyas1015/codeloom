name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repo, so a pull request cannot use the workflow token to write to it.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # pnpm 11 (root packageManager) needs Node >= 22.13, so install/build/typecheck run on Node 22;
      # the tests and the CLI smoke test then run on the matrix Node (codeloom supports Node >= 20).
      - name: Set up Node 22 for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Switch to Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test on Node ${{ matrix.node }} (includes the eval gate)
        working-directory: packages/cli
        run: |
          node --version
          npx --no-install vitest run

      - name: CLI smoke test (built bin, demo-shop)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/packages/cli/dist/bin.js"
          ROOT=$(mktemp -d)
          cp -R "$GITHUB_WORKSPACE/fixtures/demo-shop/." "$ROOT"

          # Turn each repo folder into a git repo, the same way
          # packages/cli/test/helpers.ts's materializeFixture does for tests.
          for d in "$ROOT"/*/; do
            [ -d "$d" ] || continue
            git -C "$d" init -q -b main
            git -C "$d" -c user.name=ci -c user.email=ci@example.com add -A
            git -C "$d" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m update
          done

          node "$BIN" init "$ROOT"
          (cd "$ROOT" && node "$BIN" index)
          (cd "$ROOT" && node "$BIN" check)

  # The published package: release build, pnpm pack, then install the tarball with plain npm in an empty
  # folder and drive the installed cli end to end (scripts/release/pack-test.sh). No unit tests run here:
  # outside CI they would rebuild dist/bin.js with tsc over the bundle.
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # pnpm 11 needs Node >= 22.13: build and pack on Node 22, then install and run on the matrix Node.
      - name: Set up Node 22 for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release build
        run: pnpm release:build

      - name: Pack (runs the prepack guard)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Switch to Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tarball install test on Node ${{ matrix.node }}
        shell: bash
        run: scripts/release/pack-test.sh --tarball "$(ls "$RUNNER_TEMP"/pack/codeloom-*.tgz)"

  # The dashboard's unit tests and the Playwright smoke (Chromium) against the real dashboard server on demo-shop.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (cli + dashboard)
        run: pnpm -r build

      - name: Typecheck the e2e specs
        run: pnpm typecheck:e2e

      - name: Dashboard unit tests
        run: pnpm --filter @codeloom/dashboard test

      - name: No external load targets in the dashboard build
        run: pnpm --filter @codeloom/dashboard check:dist

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
